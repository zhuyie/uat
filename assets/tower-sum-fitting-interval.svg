<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Four leap-year towers on the fitting interval</title>
  <desc id="desc">Four equal-height leap-year spikes are approximated by four local towers. The first two towers show their left and right hidden-neuron halves with callout labels.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>

  <defs>
    <style>
      .axis { stroke: #111827; stroke-width: 4; fill: none; }
      .arrow-head { fill: #111827; }
      .grid { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 8; }
      .interval { fill: #dbeafe; opacity: 0.55; }
      .label { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .year { font: 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .callout { font: 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .peak { stroke: #2563eb; stroke-width: 6; fill: none; stroke-linejoin: round; }
      .tower { fill: rgba(20, 184, 166, 0.2); stroke: #0f766e; stroke-width: 4; }
      .left-half { fill: rgba(37, 99, 235, 0.18); }
      .right-half { fill: rgba(239, 68, 68, 0.15); }
      .leader { stroke: #334155; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <!-- Top: four sparse target samples. -->
  <g transform="translate(80 70)">
    <text x="520" y="0" class="label">target leap-year samples</text>
    <rect x="70" y="35" width="1300" height="285" class="interval"/>

    <line x1="40" y1="320" x2="1415" y2="320" class="axis"/>
    <path d="M1415 320 L1395 310 L1395 330 Z" class="arrow-head"/>
    <line x1="40" y1="320" x2="40" y2="35" class="axis"/>
    <path d="M40 35 L30 55 L50 55 Z" class="arrow-head"/>

    <line x1="70" y1="320" x2="70" y2="40" class="grid"/>
    <line x1="1370" y1="320" x2="1370" y2="40" class="grid"/>
    <line x1="40" y1="85" x2="1410" y2="85" class="grid"/>
    <text x="56" y="360" class="year">1600</text>
    <text x="1320" y="360" class="year">1612</text>
    <text x="10" y="95" class="small">1</text>
    <text x="10" y="328" class="small">0</text>

    <!-- Equal-height, very narrow spikes every four years. -->
    <path class="peak" d="
      M155 320 L160 85 L165 320
      M525 320 L530 85 L535 320
      M895 320 L900 85 L905 320
      M1265 320 L1270 85 L1275 320"/>
  </g>

  <!-- Bottom: four local towers, with the first two neuron pairs labeled. -->
  <g transform="translate(80 500)">
    <text x="430" y="0" class="label">local towers from hidden-neuron pairs</text>
    <rect x="70" y="35" width="1300" height="285" class="interval"/>

    <line x1="40" y1="320" x2="1415" y2="320" class="axis"/>
    <path d="M1415 320 L1395 310 L1395 330 Z" class="arrow-head"/>
    <line x1="40" y1="320" x2="40" y2="35" class="axis"/>
    <path d="M40 35 L30 55 L50 55 Z" class="arrow-head"/>

    <line x1="70" y1="320" x2="70" y2="40" class="grid"/>
    <line x1="1370" y1="320" x2="1370" y2="40" class="grid"/>
    <line x1="40" y1="85" x2="1410" y2="85" class="grid"/>
    <text x="56" y="360" class="year">1600</text>
    <text x="1320" y="360" class="year">1612</text>
    <text x="10" y="95" class="small">1</text>
    <text x="10" y="328" class="small">0</text>

    <!-- Tower 1 -->
    <rect x="135" y="85" width="25" height="235" class="left-half"/>
    <rect x="160" y="85" width="25" height="235" class="right-half"/>
    <rect x="135" y="85" width="50" height="235" class="tower"/>

    <!-- Tower 2 -->
    <rect x="505" y="85" width="25" height="235" class="left-half"/>
    <rect x="530" y="85" width="25" height="235" class="right-half"/>
    <rect x="505" y="85" width="50" height="235" class="tower"/>

    <!-- Tower 3 and 4, unlabeled to keep the diagram readable. -->
    <rect x="875" y="85" width="25" height="235" class="left-half"/>
    <rect x="900" y="85" width="25" height="235" class="right-half"/>
    <rect x="875" y="85" width="50" height="235" class="tower"/>

    <rect x="1245" y="85" width="25" height="235" class="left-half"/>
    <rect x="1270" y="85" width="25" height="235" class="right-half"/>
    <rect x="1245" y="85" width="50" height="235" class="tower"/>

    <!-- Callouts for two pairs. -->
    <path d="M147 320 L145 365" class="leader"/>
    <text x="150" y="392" class="callout">neuron 0</text>
    <path d="M173 320 L270 365" class="leader"/>
    <text x="275" y="392" class="callout">neuron 1</text>

    <path d="M517 320 L488 365" class="leader"/>
    <text x="412" y="392" class="callout">neuron 2</text>
    <path d="M543 320 L600 365" class="leader"/>
    <text x="605" y="392" class="callout">neuron 3</text>
  </g>
</svg>
